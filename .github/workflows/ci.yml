name: CI

on:
  push:
    branches: [main, feat/production-grade]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agenticqa
          POSTGRES_USER: agenticqa
          POSTGRES_PASSWORD: agenticqa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v --tb=short
        env:
          GROQ_API_KEY: dummy-key-for-tests
          GROQ_MODEL: llama-3.3-70b-versatile
          DATABASE_URL: postgresql://agenticqa:agenticqa@localhost:5432/agenticqa
          REDIS_URL: redis://localhost:6379

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t agentic-qa-backend:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -t agentic-qa-frontend:${{ github.sha }} -f Dockerfile.frontend .
